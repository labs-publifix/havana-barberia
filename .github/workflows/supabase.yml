name: Supabase database

# Tests the schema and permissions on a throwaway Postgres, then applies the
# migrations (and the idempotent seed) to the Supabase project. Secrets live in
# the repository settings; nothing sensitive is in the code.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/test-db.sh', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', 'scripts/test-db.sh', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and permissions on a local Postgres
        run: ./scripts/test-db.sh

  deploy:
    needs: test
    # Only from main (merged) or by hand; never from a pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      # Saved as a variable or as a secret: either works.
      EMAIL_BCC: ${{ vars.EMAIL_BCC || secrets.EMAIL_BCC }}
      # Where e-mail links point (panel and, once open, the booking pages).
      SITE_URL: ${{ vars.SITE_URL || 'https://labs-publifix.github.io/havana-barberia/app' }}
      BOOKING_OPEN: ${{ vars.VITE_BOOKING_OPEN || 'false' }}
      # Optional: Session pooler connection string (IPv4). GitHub runners have no
      # IPv6, which the direct database host requires.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v en Settings › Secrets and variables › Actions"; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        env:
          # Authenticated GitHub API calls to resolve "latest" (avoids rate limits).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations and seed
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db push --remote="$SUPABASE_DB_URL" --include-seed --yes
          else
            # --remote: the linked Supabase project (never a local database).
            supabase db push --remote --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
          fi
      - name: Deploy Edge Functions
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Server-side secrets for Edge Functions
        if: env.RESEND_API_KEY != ''
        run: |
          # Empty values are skipped (e.g. EMAIL_BCC not configured yet).
          args=()
          for v in RESEND_API_KEY EMAIL_FROM EMAIL_BCC SITE_URL BOOKING_OPEN; do
            if [ -n "${!v}" ]; then args+=("$v=${!v}"); else echo "::warning::$v está vacío; no se guarda."; fi
          done
          supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes "${args[@]}"
      - name: Connect the e-mail sender to pg_cron (new shared secret each deploy)
        if: env.RESEND_API_KEY != '' && env.SUPABASE_DB_URL != ''
        run: |
          MAILER_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$MAILER_SECRET"
          supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes MAILER_SECRET="$MAILER_SECRET"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q \
            -v url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/send-emails" -v secret="$MAILER_SECRET" <<'SQL'
          insert into app.mailer_config (id, url, secret) values (1, :'url', :'secret')
          on conflict (id) do update set url = excluded.url, secret = excluded.secret, updated_at = now();
          SQL
