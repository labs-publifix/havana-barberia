name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /havana-barberia/
      VITE_DATA_SOURCE: mock
      VITE_UI_GALLERY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The real system (Supabase) under /app/, for the owner to start capturing
      # data. Only the public (publishable) key reaches the browser.
      - name: Build the real system at /app/
        env:
          VITE_BASE: /havana-barberia/app/
          VITE_DATA_SOURCE: supabase
          VITE_UI_GALLERY: 'false'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build --outDir dist/app --emptyOutDir
      # Pages has no rewrites: serve the SPA for any deep link (/cita/:token…).
      # Deep links under /app/ go to the real build, keeping the path and #hash.
      - name: 404 fallback for both builds
        run: node scripts/pages-404.mjs /havana-barberia/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
