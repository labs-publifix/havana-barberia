name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # havanabarberia.com (custom domain in Settings › Pages): the real system at
      # the root (site, booking and /admin). Only the public (publishable) key
      # reaches the browser.
      - name: Build the real system at the site root
        env:
          VITE_BASE: /
          VITE_DATA_SOURCE: supabase
          VITE_UI_GALLERY: 'false'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Public key (saved as a variable or a secret).
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_BOOKING_OPEN: ${{ vars.VITE_BOOKING_OPEN || 'false' }}
        run: npx vite build --outDir dist --emptyOutDir
      # The demo with sample data (no database), for showing the system.
      - name: Build the demo at /demo/
        env:
          VITE_BASE: /demo/
          VITE_DATA_SOURCE: mock
          VITE_UI_GALLERY: 'true'
        run: npx vite build --outDir dist/demo --emptyOutDir
      # Pages has no rewrites: 404.html is the real SPA, so deep links (/cita/:token,
      # /admin/…) open; deep links under /demo/ go to the demo, keeping path and #hash.
      - name: 404 fallback for both builds
        run: node scripts/pages-404.mjs /demo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
