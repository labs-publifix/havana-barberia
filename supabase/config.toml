# Supabase CLI project config (local tooling and `supabase db push`).
# The real project is linked in CI with SUPABASE_PROJECT_REF; no secrets here.
project_id = "havana-barberia"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
# No public sign-up: the owner invites panel users.
enable_signup = false
site_url = "https://labs-publifix.github.io/havana-barberia/"

[functions.invite-user]
# The function checks the caller's session itself (owner only).
verify_jwt = true

[functions.authorize-discount]
verify_jwt = true

# Woken by pg_cron with its own shared secret (x-mailer-secret), not a user session.
[functions.send-emails]
verify_jwt = false

# Public: the site calls it without a session (Turnstile and limits per IP inside).
[functions.booking]
verify_jwt = false
