<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Havana Barbería · Próximamente</title>
    <meta name="description" content="Havana Barbería. Muy pronto podrás reservar tu cita en línea." />
    <meta property="og:title" content="Havana Barbería" />
    <meta property="og:description" content="Muy pronto podrás reservar tu cita en línea." />
    <meta property="og:image" content="logo.jpg" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Colores tomados del logo: tinta negra, gris del poste y papel blanco. */
      :root {
        --ink: #111111;
        --muted: #5e5e5e;
        --pole: #c8c8c8;
        --paper: #ffffff;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--ink);
        color: var(--paper);
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: 18px 1fr auto 18px;
        min-height: 100dvh;
        font-family: 'Jost', system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      /* El poste de barbería del logo, como franja arriba y abajo. */
      .pole {
        background: repeating-linear-gradient(-35deg, var(--pole) 0 14px, transparent 14px 34px);
        border-block: 1px solid var(--ink);
      }
      main {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: clamp(1.5rem, 4vw, 2.5rem);
        padding: clamp(2rem, 6vw, 4rem) 1rem;
        text-align: center;
      }
      .logo {
        width: min(560px, 86vw);
        height: auto;
        display: block;
        animation: rise 900ms var(--ease) both;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.75rem);
        font-weight: 500;
        letter-spacing: 0.28em;
        margin-right: -0.28em; /* compensa el tracking para centrar */
        text-transform: uppercase;
        animation: rise 900ms 120ms var(--ease) both;
      }
      p {
        margin: 0;
        max-width: 36ch;
        color: var(--muted);
        font-size: 1.125rem;
        line-height: 1.5;
        text-wrap: balance;
        animation: rise 900ms 220ms var(--ease) both;
      }
      footer {
        padding: 1.25rem 1rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--muted);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
          filter: blur(4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="pole" aria-hidden="true"></div>
    <main>
      <img class="logo" src="logo.jpg" alt="Havana Barbería" width="2048" height="1303" />
      <h1>Próximamente</h1>
      <p>Estamos preparando algo nuevo. Muy pronto podrás reservar tu cita en línea.</p>
    </main>
    <footer>© <span id="y">2026</span> Havana Barbería</footer>
    <div class="pole" aria-hidden="true"></div>
    <script>
      document.getElementById('y').textContent = new Date().getFullYear()
    </script>
  </body>
</html>
